name: Build FacePass IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Rebuild every 6 days (before 7-day sideload expiry)
    - cron: '0 8 */6 * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select latest Xcode ───────────────────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project FacePass.xcodeproj \
            -scheme FacePass \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1

      # ── 6. Package IPA ───────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find DerivedData/ -name "*.app" -type d | grep -v ".xctest" | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ No .app found"; exit 1; fi
          echo "✅ Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FacePass.ipa Payload/
          echo "📦 $(du -sh FacePass.ipa)"

      # ── 7. Upload IPA to GitHub Releases (tag: latest) ───────────────────────
      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FacePass — Latest Build"
          body: |
            📲 **Install on iPhone:**
            1. Open this link on your iPhone: https://${{ github.repository_owner }}.github.io/Forbes-Selfie-iOS/
            2. Tap **Install Now**
          files: FacePass.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Prepare GitHub Pages install page ────────────────────────────────
      - name: Prepare Pages
        run: |
          mkdir -p docs
          # Update IPA URL in install page to use GitHub Release
          IPA_URL="https://github.com/${{ github.repository }}/releases/latest/download/FacePass.ipa"
          sed "s|https://houarimed.tech/app/FacePass.ipa|$IPA_URL|g" \
            install_page/index.html > docs/index.html
          echo "✅ Install page ready"
          echo "🔗 IPA URL: $IPA_URL"

      # ── 9. Deploy to GitHub Pages ────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-pages:
    name: Deploy install page
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
