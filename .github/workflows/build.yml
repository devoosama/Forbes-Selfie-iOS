name: Build Forbes Selfie IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Rebuild every 6 days (before 7-day sideload expiry)
    - cron: '0 8 */6 * *'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select latest Xcode ───────────────────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Forbes_Selfie.xcodeproj \
            -scheme Forbes_Selfie \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1

      # ── 6. Package IPA ───────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find DerivedData/ -name "*.app" -type d | grep -v ".xctest" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"; exit 1
          fi
          echo "✅ Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Forbes_Selfie.ipa Payload/
          echo "📦 $(du -sh Forbes_Selfie.ipa)"

      # ── 7. Upload IPA to houarimed.tech/app/ ─────────────────────────────────
      - name: Upload to Server
        env:
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          # Install sshpass
          brew install sshpass

          # Create /app/ folder on server if not exists
          sshpass -p "$SERVER_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -p 65002 \
            u106460501@houarimed.tech \
            "mkdir -p /home/u106460501/domains/houarimed.tech/public_html/app"

          # Upload IPA
          sshpass -p "$SERVER_PASS" scp \
            -o StrictHostKeyChecking=no \
            -P 65002 \
            Forbes_Selfie.ipa \
            u106460501@houarimed.tech:/home/u106460501/domains/houarimed.tech/public_html/app/Forbes_Selfie.ipa

          echo "✅ IPA uploaded to https://houarimed.tech/app/Forbes_Selfie.ipa"

      # ── 8. Upload install page (only on first push, not on cron) ─────────────
      - name: Upload Install Page
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sshpass -p "$SERVER_PASS" scp \
            -o StrictHostKeyChecking=no \
            -P 65002 \
            install_page/index.html \
            u106460501@houarimed.tech:/home/u106460501/domains/houarimed.tech/public_html/app/index.html
          echo "✅ Install page uploaded to https://houarimed.tech/app/"

      # ── 9. Save IPA as artifact too ──────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forbes_Selfie_IPA
          path: Forbes_Selfie.ipa
          retention-days: 30

      - name: Done
        run: |
          echo "🎉 Forbes Selfie IPA ready!"
          echo "📲 Install page: https://houarimed.tech/app/"
          echo "📦 Direct IPA:   https://houarimed.tech/app/Forbes_Selfie.ipa"
