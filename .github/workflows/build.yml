name: Build Forbes Selfie IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Rebuild every 6 days (before 7-day sideload expiry)
    - cron: '0 8 */6 * *'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select latest Xcode ───────────────────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Install XcodeGen ──────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      # ── 5. Build ─────────────────────────────────────────────────────────────
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Forbes_Selfie.xcodeproj \
            -scheme Forbes_Selfie \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1

      # ── 6. Package IPA ───────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find DerivedData/ -name "*.app" -type d | grep -v ".xctest" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"; exit 1
          fi
          echo "✅ Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Forbes_Selfie.ipa Payload/
          echo "📦 $(du -sh Forbes_Selfie.ipa)"

      # ── 7. Upload via FTP (curl — pre-installed on macOS runner) ────────────
      - name: Upload to Server via FTP
        env:
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          FTP_URL="ftp://houarimed.tech"
          FTP_USER="u106460501"
          FTP_DIR="domains/houarimed.tech/public_html/app"

          echo "📤 Uploading IPA..."
          curl --ftp-create-dirs \
               --user "$FTP_USER:$SERVER_PASS" \
               -T Forbes_Selfie.ipa \
               "$FTP_URL/$FTP_DIR/Forbes_Selfie.ipa"

          echo "📤 Uploading install page..."
          curl --ftp-create-dirs \
               --user "$FTP_USER:$SERVER_PASS" \
               -T install_page/index.html \
               "$FTP_URL/$FTP_DIR/index.html"

          echo "✅ Done → https://houarimed.tech/app/"

      # ── 9. Save IPA as artifact too ──────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forbes_Selfie_IPA
          path: Forbes_Selfie.ipa
          retention-days: 30

      - name: Done
        run: |
          echo "🎉 Forbes Selfie IPA ready!"
          echo "📲 Install page: https://houarimed.tech/app/"
          echo "📦 Direct IPA:   https://houarimed.tech/app/Forbes_Selfie.ipa"
