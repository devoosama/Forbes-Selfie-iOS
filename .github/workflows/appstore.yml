name: Build & Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed IPA → TestFlight
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      # ── 1. Checkout (no persistent credentials to avoid polluting brew git) ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # ── 2. Select latest Xcode ───────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 2b. Generate placeholder App Icons (120x120, 180x180, 1024x1024) ──
      - name: Generate App Icons
        run: |
          python3 << 'PYEOF'
          import struct, zlib

          def create_png(w, h):
              def chunk(t, d):
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              row  = b'\x00' + bytes([7, 9, 26] * w)   # dark-navy RGB, no filter
              idat = chunk(b'IDAT', zlib.compress(row * h, 1))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend

          base = 'Forbes_Selfie/Assets.xcassets/AppIcon.appiconset/'
          for fname, w, h in [
              ('AppIcon-1024.png',  1024, 1024),
              ('AppIcon-60@2x.png',  120,  120),
              ('AppIcon-60@3x.png',  180,  180),
          ]:
              with open(base + fname, 'wb') as f:
                  f.write(create_png(w, h))
              print(f'Created {fname}')
          PYEOF

      # ── 3. Install XcodeGen (no Homebrew auto-update / git fetch) ──
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      # ── 5. Install Fastlane ──────────────────────────────────────
      - name: Install Fastlane
        run: gem install fastlane --no-document

      # ── 6. Prepare build output folder ───────────────────────────
      - name: Create build folder
        run: mkdir -p ./build

      # ── 7. Run Fastlane beta lane ────────────────────────────────
      - name: Build & Upload to TestFlight
        env:
          ASC_KEY_ID:                  ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:               ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:             ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_SKIP_UPDATE_CHECK:  "1"
          FASTLANE_OPT_OUT_USAGE:      "1"
          MATCH_SKIP_STORAGE_PUSH:     "1"
          GIT_TERMINAL_PROMPT:         "0"
        run: fastlane beta
