name: Build & Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed IPA → TestFlight
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      # ── 1. Checkout (no persistent credentials to avoid polluting brew git) ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # ── 1b. Generate all icon sizes from 1024px source using sips ──────
      #  The "universal" single-icon format only writes to Assets.car;
      #  the old explicit-size format forces actool to also write loose
      #  PNG files into the app bundle (required by altool validation).
      - name: Generate App Icon sizes
        run: |
          SRC="Forbes_Selfie/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          DIR="Forbes_Selfie/Assets.xcassets/AppIcon.appiconset"
          # Re-encode source as clean macOS PNG (strips Windows metadata)
          sips -s format png "$SRC" --out "$SRC"
          # iPhone icons  (sips -z takes height then width)
          sips -z  40  40 "$SRC" --out "$DIR/Icon-20@2x.png"
          sips -z  60  60 "$SRC" --out "$DIR/Icon-20@3x.png"
          sips -z  58  58 "$SRC" --out "$DIR/Icon-29@2x.png"
          sips -z  87  87 "$SRC" --out "$DIR/Icon-29@3x.png"
          sips -z  80  80 "$SRC" --out "$DIR/Icon-40@2x.png"
          sips -z 120 120 "$SRC" --out "$DIR/Icon-40@3x.png"
          sips -z 120 120 "$SRC" --out "$DIR/Icon-60@2x.png"
          sips -z 180 180 "$SRC" --out "$DIR/Icon-60@3x.png"
          # iPad icons
          sips -z  20  20 "$SRC" --out "$DIR/Icon-ipad-20@1x.png"
          sips -z  40  40 "$SRC" --out "$DIR/Icon-ipad-20@2x.png"
          sips -z  29  29 "$SRC" --out "$DIR/Icon-ipad-29@1x.png"
          sips -z  58  58 "$SRC" --out "$DIR/Icon-ipad-29@2x.png"
          sips -z  40  40 "$SRC" --out "$DIR/Icon-ipad-40@1x.png"
          sips -z  80  80 "$SRC" --out "$DIR/Icon-ipad-40@2x.png"
          sips -z  76  76 "$SRC" --out "$DIR/Icon-ipad-76@1x.png"
          sips -z 152 152 "$SRC" --out "$DIR/Icon-ipad-76@2x.png"
          sips -z 167 167 "$SRC" --out "$DIR/Icon-ipad-83.5@2x.png"
          echo "=== Generated icons ==="
          ls -la "$DIR/"*.png

      # ── 2. Select latest Xcode ───────────────────────────────────
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── 3. Install XcodeGen (no Homebrew auto-update / git fetch) ──
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: brew install xcodegen

      # ── 4. Generate .xcodeproj ───────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      # ── 4b. Debug: verify generated project settings ────────────
      - name: Debug – generated project settings
        run: |
          echo "=== INFOPLIST_FILE ==="
          grep "INFOPLIST_FILE" FacePass.xcodeproj/project.pbxproj | grep -v "//" || echo "NOT FOUND"
          echo "=== GENERATE_INFOPLIST_FILE ==="
          grep "GENERATE_INFOPLIST_FILE" FacePass.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "=== TARGETED_DEVICE_FAMILY ==="
          grep "TARGETED_DEVICE_FAMILY" FacePass.xcodeproj/project.pbxproj || echo "NOT FOUND"
          echo "=== Info.plist source keys ==="
          grep -E "CFBundleIconName|ipad|UILaunchScreen" Forbes_Selfie/Resources/Info.plist || echo "NOT FOUND in source"

      # ── 5. Install Fastlane ──────────────────────────────────────
      - name: Install Fastlane
        run: gem install fastlane --no-document

      # ── 6. Prepare build output folder ───────────────────────────
      - name: Create build folder
        run: mkdir -p ./build

      # ── 7. Run Fastlane beta lane ────────────────────────────────
      - name: Build & Upload to TestFlight
        env:
          ASC_KEY_ID:                  ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:               ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:             ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_SKIP_UPDATE_CHECK:  "1"
          FASTLANE_OPT_OUT_USAGE:      "1"
          MATCH_SKIP_STORAGE_PUSH:     "1"
          GIT_TERMINAL_PROMPT:         "0"
        run: fastlane beta
